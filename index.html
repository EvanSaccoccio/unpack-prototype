<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Unpack — Social Travel MVP Prototype</title>
<style>
:root{--ink:#17332e;--muted:#71817b;--bg:#eef1e9;--card:#fffefa;--accent:#126d5c;--mint:#def1e9;--border:#e1e8de;--gold:#e9b16d}*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#dbe4df;display:flex;justify-content:center;padding:18px}button,input{font:inherit}button{cursor:pointer}#app{height:min(850px,calc(100dvh - 36px));min-height:590px;width:390px;max-width:100%;border:6px solid #233c35;border-radius:36px;overflow:hidden;background:var(--card);box-shadow:0 24px 70px #1c443844;display:flex;flex-direction:column;position:relative}.top{padding:19px 19px 11px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}.brand{font:700 25px Georgia,serif;letter-spacing:-1px}.tag{color:var(--muted);font-size:11px}.r{display:flex;align-items:center;justify-content:space-between;gap:10px}.body{flex:1;overflow:auto;padding:15px 16px 35px;scrollbar-width:thin}.bottom{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:#fffefa;padding:8px 3px 10px;flex-shrink:0}.nav{background:none;border:0;color:#73857e;font-size:10px;display:flex;align-items:center;flex-direction:column;gap:2px}.nav b{font-size:21px;font-weight:400}.nav.on{color:var(--accent);font-weight:700}.heading{font-size:22px;font-family:Georgia,serif;margin:3px 0 13px;font-weight:700}.section{font-size:15px;font-weight:750;margin:18px 0 9px}.sub{color:var(--muted);font-size:12px}.card{border:1px solid var(--border);border-radius:16px;background:white;overflow:hidden;margin:10px 0}.pad{padding:12px}.hero{height:168px;background:linear-gradient(125deg,#25594d,#88b5a3 40%,#d5a77b);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 65% 30%,#f5dca2 0%,transparent 21%),linear-gradient(155deg,transparent 30%,#1d493b 31%,#32604f 56%,transparent 57%),linear-gradient(20deg,#173e37 18%,transparent 19%);opacity:.85}.hero.jp{background:linear-gradient(140deg,#917785,#d9afa1 55%,#698b8d)}.hero.jp:before{background:radial-gradient(circle at 72% 24%,#ffdda5 0%,transparent 24%),linear-gradient(125deg,transparent 39%,#4c6c66 40%,#516b65 50%,transparent 51%),linear-gradient(17deg,#4a6263 18%,transparent 19%)}.hero.it{background:linear-gradient(120deg,#c5baa1,#e2ad86,#7298a0)}.hero.it:before{background:linear-gradient(10deg,#bd8669 18%,transparent 19%),linear-gradient(135deg,transparent 35%,#b37b5d 36%,#d6a68a 59%,transparent 60%)}.hero .title{position:absolute;bottom:10px;left:13px;color:white;text-shadow:0 2px 9px #17332e;font-size:23px;font-family:Georgia,serif}.pill{background:#e7eee9;border:0;border-radius:20px;padding:8px 11px;color:#385d51;font-size:12px}.pill.selected{background:var(--accent);color:white}.btn{border:0;background:var(--accent);color:white;padding:11px 14px;border-radius:11px;font-weight:700}.btn.secondary{background:#e4eee8;color:var(--accent)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid #b9d2c6}.full{width:100%}.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.smallcard{flex:none;width:157px;border-radius:12px;border:1px solid var(--border);overflow:hidden;background:#fff}.smallcard .hero{height:112px}.smallcard .hero .title{font-size:15px}.badge{display:inline-block;font-size:10px;padding:3px 7px;border-radius:99px;background:#dff1e8;color:#136952;font-weight:700}.badge.unread{background:#fff0d8;color:#916127}.entry{border:1px solid var(--border);background:white;border-radius:13px;padding:13px;margin:10px 0}.entry.new{border-left:4px solid #d58f32}.entry h3{margin:7px 0 4px;font-size:15px}.entry p{margin:5px 0 10px;color:#536860}.actions{display:flex;gap:7px;margin-top:10px}.seg{display:flex;background:#e8eee9;border-radius:12px;padding:3px;gap:2px;margin:12px 0}.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 3px;font-weight:650;font-size:12px;color:#64796e}.seg button.on{background:white;color:var(--accent);box-shadow:0 1px 4px #345c3c1b}.map{height:255px;background:#e8eee3;border-radius:15px;overflow:hidden;position:relative;border:1px solid #d1ddd0}.map svg{width:100%;height:100%}.pin{position:absolute;border:3px solid white;background:var(--accent);color:white;border-radius:30px;width:31px;height:31px;font-size:13px;box-shadow:0 3px 9px #284b4966}.pin.on{background:#d68140;transform:scale(1.17)}.line{border-left:2px solid #bed5c8;margin-left:13px;padding-left:21px;padding-bottom:15px;position:relative}.line:before{content:"";position:absolute;top:2px;left:-7px;width:12px;height:12px;background:#548f79;border:2px solid white;border-radius:50%}.field{width:100%;border:1px solid #cfdcd2;background:white;border-radius:11px;padding:12px;outline-color:var(--accent);margin:6px 0}.issue{border-left:4px solid #e2ab53}.checkline{display:flex;gap:9px;align-items:center;padding:9px 0}.checkline input{accent-color:var(--accent);width:18px;height:18px}.mutebox{background:#eff5ef;padding:13px;border-radius:12px;margin:12px 0}.notice{background:#fff3df;border-radius:12px;padding:12px;color:#76582a;font-size:12px;margin:11px 0}.overlay{position:absolute;inset:0;background:#132c2580;display:flex;align-items:flex-end;z-index:3}.sheet{width:100%;background:#fffefa;border-radius:22px 22px 26px 26px;padding:18px 20px 25px;max-height:85%;overflow:auto}.hr{height:1px;background:var(--border);margin:13px 0}.tiny{font-size:11px}.active-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#168d69;margin-right:5px}.sr{position:absolute;left:-10000px}.link{border:none;background:none;color:var(--accent);font-weight:700;padding:5px 0}button:focus-visible,input:focus-visible{outline:3px solid #f4ad65;outline-offset:2px}@media(max-width:450px){body{padding:0;background:white}#app{width:100%;max-width:none;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}

/* Floating bottom navigation */
.body{padding-bottom:105px}.bottom{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:2;border:1px solid rgba(18,109,92,.12);border-radius:26px;background:rgba(255,254,250,.96);padding:10px 6px 11px;box-shadow:0 8px 28px rgba(23,51,46,.18),0 2px 6px rgba(23,51,46,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.nav{border-radius:18px;min-height:44px;justify-content:center;gap:3px}.nav.on{background:var(--mint)}
</style></head><body><div id="app"><header class="top" id="top"></header><main class="body" id="main"></main><footer class="bottom" id="nav"></footer><div id="modal"></div></div><script>
const state={tab:'following',journeyView:'diary',followingTrip:false,seen:['arrival'],saved:[],destination:'Florence',source:'Friends',category:'All',selected:'safari',photoStage:'start',processed:false,issues:{dinner:'uncertain',museum:'suggested'},included:{dinner:true,museum:true,river:true},audience:'Only me',tripStatus:'active',newCount:0,modal:null,from:'following'};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const experiences=[{id:'arrival',day:1,title:'Arrival in Costa Rica',place:'La Fortuna',type:'Arrival',desc:'Made it to the rainforest. Our first evening was incredible.',x:29,y:65},{id:'safari',day:2,title:'Jungle wildlife safari',place:'Rainforest near La Fortuna',type:'Nature',desc:'Saw toucans and a sloth on our guided wildlife walk. Absolutely unforgettable.',x:54,y:35},{id:'lunch',day:2,title:'Lunch after our hike',place:'Location not confirmed',type:'Food',desc:'Delicious local lunch after the tour. Still need to tag the restaurant.',x:null,y:null},{id:'waterfall',day:3,title:'La Fortuna Waterfall',place:'La Fortuna Waterfall',type:'Nature',desc:'A steep hike and a beautiful waterfall. Definitely worth it.',x:76,y:73}];
const recommendations=[{id:'florence',name:'Favorite pasta dinner',dest:'Florence',cat:'Food',by:'Friend',detail:'Food 4/5 · Ambience 3/5'},{id:'duomo',name:'Florence Cathedral',dest:'Florence',cat:'Sights',by:'Friend',detail:'Sunrise visit recommended'},{id:'kyoto',name:'Nishiki Market',dest:'Kyoto',cat:'Food',by:'Friend',detail:'Great street food'},{id:'japan',name:'Fushimi Inari',dest:'Kyoto',cat:'Sights',by:'Creator',detail:'Walk the trail early'},{id:'porto',name:'Ribeira river walk',dest:'Porto',cat:'Sights',by:'Creator',detail:'Scenic walking route'}];
function mapHTML(pins){return `<div class="map"><svg viewBox="0 0 360 250" preserveAspectRatio="none"><rect width="360" height="250" fill="#e3ebe1"/><path d="M0 75 Q70 35 135 92 T360 50V250H0Z" fill="#c1d7bc"/><path d="M-10 200Q95 100 170 160T370 110" stroke="#f6f6e9" stroke-width="18" fill="none"/><path d="M35 0Q140 105 270 85T360 210" stroke="#f6f6e9" stroke-width="8" fill="none"/><path d="M20 115Q120 75 210 170T390 220" stroke="#a2c7bd" stroke-width="16" fill="none"/><path d="M0 225Q185 210 360 185" stroke="#f6f6e9" stroke-width="6" fill="none"/></svg>${pins.filter(p=>p.x!==null).map((p,i)=>`<button aria-label="Select ${escapeHtml(p.title)}" class="pin ${state.selected===p.id?'on':''}" style="left:calc(${p.x}% - 14px);top:calc(${p.y}% - 14px)" onclick="selectExperience('${p.id}')">${i+1}</button>`).join('')}</div>`}
function renderTop(){document.getElementById('top').innerHTML=`<div class="r"><div><span class="brand">unpack<span style="color:#dc9257">.</span></span><div class="tag">Travel through your people</div></div><span class="badge">MVP PROTOTYPE</span></div>`}
function nav(){const a=[['following','⌂','Following'],['explore','⌕','Explore'],['capture','＋','Capture'],['saved','▣','Saved'],['profile','◯','Profile']];document.getElementById('nav').innerHTML=a.map(x=>`<button class="nav ${state.tab===x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function go(t){state.tab=t;state.modal=null;render();document.getElementById('main').scrollTop=0}function openJourney(){state.from=state.tab;go('journey')}
function render(){renderTop();nav();document.getElementById('main').innerHTML=({following,explore,capture,saved,profile,journey,place}[state.tab]||following)();document.getElementById('modal').innerHTML=state.modal?modal():''}
function following(){return `<h1 class="heading">Following</h1><div class="r"><b>Active journeys</b><span class="sub">From your friends</span></div><div class="hscroll"><div class="smallcard" onclick="openJourney()" role="button" tabindex="0"><div class="hero"><span class="title">Costa Rica 🌿</span></div><div class="pad"><b><span class="active-dot"></span>Alex's adventure</b><div class="sub">${3+state.newCount-state.seen.filter(id=>experiences.slice(0,3+state.newCount).some(e=>e.id===id)).length} unread updates</div></div></div><div class="smallcard" onclick="openJourney()" role="button" tabindex="0"><div class="hero jp"><span class="title">Japan ✨</span></div><div class="pad"><b>Sam's Japan trip</b><div class="sub">New food tour</div></div></div></div><div class="mutebox r"><div><b>Planning somewhere?</b><div class="sub">See where your friends recommend</div></div><button class="btn secondary" onclick="go('explore')">Explore →</button></div><h2 class="section">Recent experiences</h2><article class="card"><div class="hero"><span class="title">Jungle safari</span></div><div class="pad"><span class="badge unread">New from Alex</span><h3 style="margin:8px 0 3px">Saw sloths and toucans today!</h3><p class="sub">Part of Costa Rica Adventure</p><div class="actions"><button class="btn secondary" onclick="openJourney()">Open journey</button><button class="btn ghost" onclick="save('safari')">${state.saved.includes('safari')?'✓ Saved':'♡ Save'}</button></div></div></article><h2 class="section">Recently completed</h2><article class="card pad"><b>Jordan's week in Portugal</b><div class="sub">14 experiences · A reusable trip guide</div><button class="link" onclick="go('explore')">Discover similar journeys →</button></article><p class="sub">Sample people, destinations and posts. No live social data is connected.</p>`}
function journey(){let available=experiences.slice(0,3+state.newCount);let unread=available.filter(e=>!state.seen.includes(e.id));return `<div class="r"><button class="link" onclick="go('${state.from==='journey'?'following':state.from}')">← Back</button><span class="badge">● Active journey</span></div><div class="hero"><span class="title">Costa Rica Adventure</span></div><div class="r" style="margin:12px 0"><div><b>Alex's rainforest escape</b><div class="sub">${available.length} experiences · ${unread.length} unread</div></div><button class="btn ${state.followingTrip?'secondary':''}" onclick="state.followingTrip=!state.followingTrip;render()">${state.followingTrip?'✓ Following':'＋ Follow trip'}</button></div><div class="seg">${['diary','map','itinerary'].map(v=>`<button class="${state.journeyView===v?'on':''}" onclick="state.journeyView='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>${state.journeyView==='diary'?`${unread.length?`<button class="btn secondary full" onclick="selectExperience('${unread[0].id}')">↓ Jump to next unread (${unread.length})</button>`:''}${available.map(e=>`<article class="entry ${!state.seen.includes(e.id)?'new':''}" id="entry-${e.id}"><div class="r"><span class="sub">Day ${e.day} · ${e.type}</span>${!state.seen.includes(e.id)?'<span class="badge unread">NEW</span>':''}</div><h3>${e.title}</h3><p>${e.desc}</p><div class="sub">⌖ ${e.place}</div><div class="actions"><button class="btn secondary" onclick="selectExperience('${e.id}')">${state.selected===e.id?'✓ Viewed':'View'}</button><button class="btn ghost" onclick="state.selected='${e.id}';state.journeyView='map';render()">Map</button><button class="btn ghost" onclick="save('${e.id}')">${state.saved.includes(e.id)?'✓ Saved':'♡ Save'}</button></div></article>`).join('')}`:state.journeyView==='map'?`${mapHTML(available)}<h2 class="section">Places shared on this trip</h2>${available.map(e=>`<button class="entry full" style="text-align:left;${state.selected===e.id?'border-color:#126d5c':''}" onclick="selectExperience('${e.id}')"><b>${e.title}</b><div class="sub">${e.place}${e.x===null?' · No map pin':''}</div></button>`).join('')}`:`<h2 class="section">Growing itinerary</h2>${[1,2,3].filter(d=>available.some(e=>e.day===d)).map(d=>`<h3>Day ${d}</h3>${available.filter(e=>e.day===d).map(e=>`<div class="line"><button class="link" onclick="selectExperience('${e.id}')">${e.title}</button><div class="sub">${e.place}</div></div>`).join('')}`).join('')}`}<div class="mutebox"><b>This trip grows as Alex shares.</b><p class="sub">“Live” means actively publishing a diary, not broadcasting Alex's actual location.</p><button class="btn secondary full" onclick="addEntry()">Simulate a new update</button></div>`}
function selectExperience(id){state.selected=id;if(!state.seen.includes(id))state.seen.push(id);render();if(state.journeyView==='diary')document.getElementById('entry-'+id)?.scrollIntoView({block:'center',behavior:'smooth'})}
function addEntry(){state.newCount=1;render()}
function explore(){let rs=recommendations.filter(r=>(state.destination==='All'||r.dest===state.destination)&&(state.category==='All'||r.cat===state.category)&&(state.source==='All'||r.by===state.source));return `<h1 class="heading">Explore places</h1><div class="sub">Discover where your friends have been and what they recommend.</div><label class="tiny" for="dest">Destination</label><select id="dest" class="field" onchange="state.destination=this.value;render()">${['Florence','Kyoto','Porto','All'].map(s=>`<option ${state.destination===s?'selected':''}>${s}</option>`).join('')}</select><div class="seg">${['Friends','Creators','All'].map(s=>`<button class="${state.source===s?'on':''}" onclick="state.source='${s}';render()">${s}</button>`).join('')}</div><div class="hscroll">${['All','Food','Sights'].map(c=>`<button class="pill ${state.category===c?'selected':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}</div><div style="margin-top:12px">${mapHTML(rs.map((r,i)=>({...r,id:r.id,title:r.name,x:24+i*20,y:30+i%2*35})))}</div><h2 class="section">${rs.length} shared recommendations</h2>${rs.length?rs.map(r=>`<article class="entry"><div class="r"><div><b>${r.name}</b><div class="sub">${r.dest} · ${r.by} · ${r.cat}</div></div><button class="btn ghost" onclick="save('${r.id}')">${state.saved.includes(r.id)?'✓':'♡'}</button></div><p>${r.detail}</p><button class="link" onclick="showPlace('${r.id}')">View experience →</button></article>`).join(''):`<div class="mutebox">No results for this sample filter. Try All or another destination.</div>`}<div class="sub">Map geometry is schematic. Production uses real coordinates and a mapping service.</div>`}
function showPlace(id){state.selected=id;state.from='explore';go('place')}
function place(){let r=recommendations.find(r=>r.id===state.selected)||recommendations[0];return `<button class="link" onclick="go('explore')">← Explore</button><div class="hero it"><span class="title">${r.dest}</span></div><h1 class="heading">${r.name}</h1><p class="sub">Shared recommendation from a ${r.by.toLowerCase()} · ${r.cat}</p><div class="entry"><b>Friend's recommendation</b><p>${r.detail}</p><button class="btn full" onclick="save('${r.id}')">${state.saved.includes(r.id)?'✓ Saved to Ideas':'♡ Save to Ideas'}</button></div><p class="sub">Saved references preserve the original author and journey. No venue data is verified in this prototype.</p>`}
function capture(){return `<h1 class="heading">Capture your travels</h1>${state.photoStage==='start'?`<div class="hero it"><span class="title">Every photo tells a story.</span></div><p>Import memories and let the app propose a journey you can edit and share.</p><div class="mutebox"><b>Sample import: 6 Italy photos</b><p class="sub">This uses illustrative content to demonstrate the experience without accessing your photo library.</p><button class="btn full" onclick="state.photoStage='progress';render()">＋ Simulate photo selection</button></div><button class="btn ghost full" onclick="state.modal='permission';render()">Preview permission explanation</button>`:state.photoStage==='progress'?`<div class="mutebox"><b>6 photos selected</b><p>Private draft created. Organizing photos by available dates and places.</p><p class="sub">The real app would show the draft immediately while optional enrichment runs asynchronously.</p><button class="btn full" onclick="state.photoStage='review';render()">View generated journey →</button></div>`:state.photoStage==='review'?reviewCapture():publishCapture()}`}
function reviewCapture(){let open=Object.values(state.issues).filter(v=>v==='uncertain').length;return `<div class="r"><h1 class="heading">Italy Memories</h1><span class="badge">Private draft</span></div><div class="hero it"><span class="title">Florence → Venice</span></div><p class="sub">6 photos · 3 experience groups · ${open} issue${open===1?'':'s'} to review</p>${open?`<div class="notice">⚠ ${open} place suggestion needs confirmation before it can appear as a verified venue on a shared map.</div>`:'<div class="mutebox">✓ No unresolved place matches.</div>'}<div class="entry"><div class="r"><b>Day 1 · Florence Cathedral</b><span class="badge">Suggested</span></div><p class="sub">Recognizable landmark · You can change this location.</p></div><div class="entry issue"><div class="r"><b>Day 1 · Pasta dinner</b><span class="badge unread">Review</span></div><p class="sub">Possible match: Trattoria Mario, not confirmed</p>${state.issues.dinner==='uncertain'?`<div class="actions"><button class="btn secondary" onclick="state.modal='correct';render()">Correct place</button><button class="btn ghost" onclick="state.issues.dinner='unlocated';render()">Keep unlocated</button></div>`:`<div class="badge">${state.issues.dinner==='confirmed'?'✓ User-confirmed place':'Kept without venue'}</div><button class="link" onclick="state.issues.dinner='uncertain';render()">Edit</button>`}</div><div class="entry"><b>Day 2 · Walk by the canals</b><p class="sub">Venice · Grouped from 3 photos</p></div><div class="mutebox"><b>Your journey is private</b><p class="sub">Review only what matters, then decide which memories to publish.</p></div><button class="btn full" onclick="state.photoStage='publish';render()">Preview sharing →</button><button class="btn secondary full" style="margin-top:7px" onclick="state.photoStage='start';render()">Restart import demo</button>`}
function publishCapture(){return `<button class="link" onclick="state.photoStage='review';render()">← Back to draft</button><h1 class="heading">Share your journey</h1><div class="hero it"><span class="title">Italy Memories</span></div><h2 class="section">Audience</h2>${['Only me','Friends','Public'].map(a=>`<label class="checkline"><input type="radio" name="audience" ${state.audience===a?'checked':''} onchange="state.audience='${a}';render()">${a}</label>`).join('')}<div class="hr"></div><h2 class="section">Include in shared journey</h2>${[['dinner','Pasta dinner'],['museum','Florence Cathedral'],['river','Venice canals']].map(([id,title])=>`<label class="checkline"><input type="checkbox" ${state.included[id]?'checked':''} onchange="state.included.${id}=this.checked;render()">${title}</label>`).join('')}<div class="notice">Exact trip dates are hidden. Unconfirmed places are never shown as verified business recommendations.</div><div class="mutebox"><b>Audience preview: ${state.audience}</b><p class="sub">${Object.values(state.included).filter(Boolean).length} included experiences. Only user-authorized content would be shared.</p></div><button class="btn full" onclick="state.modal='published';render()">${state.audience==='Only me'?'Save private journey':'Confirm publication (demo)'}</button>`}
function savedPageItems(){return state.saved.map(id=>{let r=recommendations.find(x=>x.id===id);let e=experiences.find(x=>x.id===id);return `<div class="entry"><b>${r?.name||e?.title||id}</b><div class="sub">${r?.dest||e?.place||''}</div><button class="link" onclick="save('${id}')">Remove bookmark</button></div>`}).join('')}
function saved(){return `<h1 class="heading">Saved ideas</h1><p class="sub">Collect travel inspiration now; turn it into plans later.</p>${state.saved.length?savedPageItems():'<div class="mutebox">No saved recommendations yet. Explore a trip or a destination and bookmark an experience.</div>'}<button class="btn secondary full" onclick="go('explore')">Find recommendations →</button>`}
function profile(){return `<h1 class="heading">Your travel identity</h1><div class="r"><div><b>My travel atlas</b><p class="sub">Private memories and shared journeys</p></div><div style="font-size:36px">◉</div></div><div class="mutebox"><b>Italy Memories</b><p class="sub">${state.photoStage==='start'?'No imported trips yet':'Private photo journey · Florence and Venice'}</p><button class="btn secondary" onclick="go('capture')">${state.photoStage==='start'?'Start a journey':'Continue editing'}</button></div><h2 class="section">Example public profile</h2><div class="card"><div class="hero jp"><span class="title">Japan Adventure</span></div><div class="pad"><b>Photo journal + recommendation map</b><p class="sub">Profiles organize memories by journey and destination, not just a wall of disconnected posts.</p></div></div>`}
function save(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render()}
function modal(){return `<div class="overlay" role="presentation" onclick="state.modal=null;render()"><div class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="r"><b>${state.modal==='correct'?'Confirm this place':state.modal==='permission'?'Photo permissions':'Journey preview'}</b><button class="link" onclick="state.modal=null;render()">✕ Close</button></div><div class="hr"></div>${state.modal==='correct'?`<p class="sub">Generic food photos cannot reliably identify an exact restaurant. The suggested venue must be confirmed or replaced.</p><label for="place-name">Place name</label><input id="place-name" class="field" value="Trattoria Mario"/><button class="btn full" onclick="state.issues.dinner='confirmed';state.modal=null;render()">Confirm this place (demo)</button><button class="btn secondary full" style="margin-top:8px" onclick="state.issues.dinner='unlocated';state.modal=null;render()">Keep without location</button>`:state.modal==='permission'?`<p>Choose only the photos you want to import. We use available timestamps and locations to suggest trip organization.</p><p class="sub">Full-library access and background location tracking are not needed. Captured images stay private until you explicitly share them.</p><button class="btn full" onclick="state.modal=null;render()">Understood</button>`:`<p>Your changes have been saved in this local demonstration only. No content was actually uploaded or published.</p><button class="btn full" onclick="state.modal=null;state.photoStage='review';render()">Back to draft</button>`}</div></div>`}
render();
</script></body></html>
